server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: every unknown route -> index.html
    location / {
        try_files $uri /index.html;
    }

    # Proxy API to the backend service (docker-compose internal DNS).
    # The upstream host goes through a variable so nginx resolves `backend` per
    # request instead of at startup — without it the image refuses to boot
    # anywhere the backend container is absent ("host not found in upstream").
    resolver 127.0.0.11 valid=30s ipv6=off;
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;          # SSE
        proxy_read_timeout 1h;
    }
}
